<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis apuntes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--bg:#eef1f5;--side:#14213d;--sideink:#e8edf8;--panel:#fbfcfd;--paper:#fff;--ink:#15203a;--mut:#667086;--line:#dde3ec;--acc:#2446b8;--onacc:#fff;--hl:#ffe066;--hlink:#15203a;--danger:#b3261e;--code:#eef1f6}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--side:#0a0f1c;--sideink:#dfe6f5;--panel:#141b2e;--paper:#182036;--ink:#e6ebf7;--mut:#8f9ab3;--line:#263150;--acc:#8aa6ff;--onacc:#0d1220;--hl:#f4cf3a;--danger:#ff8a80;--code:#222c46}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn:disabled{opacity:.6}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.mut{color:var(--mut);font-size:13px}
#cfg{max-width:420px;margin:0 auto;padding:32px 20px;display:grid;gap:10px}
#cfg h1{margin:0}
#cerr{color:var(--danger)}
.app{display:grid;grid-template-columns:240px 320px 1fr;height:100%}
.pane{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
#p1{background:var(--side);color:var(--sideink)}
#p1 .btn,#p1 select,#p1 input{border-color:rgba(255,255,255,.3)}
#p1 .mut{color:var(--sideink);opacity:.7}
#p2{background:var(--panel);border-right:1px solid var(--line)}
#p3{background:var(--paper)}
.hd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.hd h2{margin:0;font-size:17px;flex:1;min-width:0}
.pad{padding:0 14px 10px;display:grid;gap:8px}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#mats li{display:flex;justify-content:space-between;padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
#mats li.on{background:rgba(255,255,255,.12);border-left-color:var(--hl)}
#items li{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#items li.on{background:var(--hl);color:var(--hlink)}
#items li.on .mut{color:var(--hlink);opacity:.75}
#items .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:6px;font-size:12px}
p.mut{padding:6px 14px}
.back{display:none}
.ti{flex:1;min-width:0;border:0;background:transparent;font:600 21px Georgia,serif;outline:0}
.meta{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding:0 14px 10px}
.tabs{display:flex;gap:8px;padding:0 14px 10px;align-items:center;flex-wrap:wrap}
.tabs .on{background:var(--hl);color:var(--hlink);border-color:var(--hl)}
.sp{flex:1}
#tx{flex:1;width:100%;border:0;border-top:1px solid var(--line);resize:none;outline:0;background:transparent;font:16px/1.6 ui-monospace,Consolas,monospace;padding:14px}
.md{flex:1;overflow:auto;border-top:1px solid var(--line);padding:14px 20px;font:17px/1.65 Georgia,serif}
.md h1,.md h2,.md h3{font-family:system-ui,sans-serif;line-height:1.25}
.md pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
.md code{background:var(--code);padding:1px 5px;border-radius:4px}
.md pre code{padding:0}
.md blockquote{margin:0;padding-left:14px;border-left:3px solid var(--hl)}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.empty{margin:auto;color:var(--mut);padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;max-width:90vw;z-index:9}
@media(max-width:820px){
.app{grid-template-columns:1fr}.pane{display:none}
.app[data-pane=side] #p1,.app[data-pane=list] #p2,.app[data-pane=ed] #p3{display:flex}
.back{display:inline-block}.meta{grid-template-columns:1fr}
}
</style></head>
<body>
<div id="cfg" hidden>
 <h1>Mis apuntes</h1>
 <p class="mut">Conecta tu repositorio privado de GitHub. El token se guarda solo en este navegador.</p>
 <input id="ow" placeholder="Usuario de GitHub (ej. maria-perez)" autocomplete="off">
 <input id="rp" placeholder="Repositorio (ej. mis-apuntes-db)" autocomplete="off">
 <input id="tk" type="password" placeholder="Token de acceso (github_pat_…)" autocomplete="off">
 <button class="btn pri" id="go">Conectar</button>
 <div id="cerr"></div>
</div>
<div class="app" data-pane="list" hidden>
 <aside class="pane" id="p1">
  <div class="hd"><h2>Mis apuntes</h2></div>
  <div class="pad"><button class="btn" id="nn">Nuevo apunte</button></div>
  <ul class="list" id="mats"></ul>
  <div class="pad">
   <select id="tagsel" aria-label="Filtrar por etiqueta"></select>
   <label class="mut">Modificados desde<input id="desde" type="date"></label>
   <button class="btn" id="salir">Cambiar token o repositorio</button>
  </div>
 </aside>
 <section class="pane" id="p2">
  <div class="hd"><button class="btn back" data-b="side" aria-label="Materias">‹</button><h2 id="ln"></h2><button class="btn" id="ref">Actualizar</button></div>
  <div class="pad"><input id="q" type="search" placeholder="Buscar por título"></div>
  <ul class="list" id="items"></ul>
 </section>
 <main class="pane" id="p3"></main>
</div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const b64=s=>{let r='';new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const S={lista:[],shas:{},nota:null,dirty:false,mat:'',tag:'',q:'',desde:''};
let CFG=null;try{CFG=JSON.parse(localStorage.getItem('apuntes.cfg'))}catch(e){}

/* ===== Capa de datos: API de contenidos de GitHub ===== */
async function gh(path,opt={}){
 const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}`,{cache:'no-store',...opt,
  headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
 if(r.status===404)return null;
 if(!r.ok){const e=new Error(r.status===401?'El token no es válido o venció.':r.status===403?'Sin permiso o límite de la API alcanzado.':r.status===409||r.status===422?'conflicto':'Error de GitHub ('+r.status+').');e.status=r.status;throw e}
 return r.json();
}
async function leer(path){const j=await gh(path);return j?{data:JSON.parse(unb64(j.content)),sha:j.sha}:null}
async function escribir(path,data,sha,msg){
 const j=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64(JSON.stringify(data,null,1)),...(sha?{sha}:{})})});
 if(!j)throw new Error('Repositorio no encontrado o el token no tiene acceso a él.');
 return j.content.sha;
}
const obtenerIndice=()=>leer('data/index.json');
const obtenerNota=id=>leer(`data/notas/${id}.json`);
const meta=n=>({id:n.id,titulo:n.titulo,materia:n.materia,tags:n.tags,fecha:n.fecha});
async function actualizarIndice(fn,msg){
 for(let i=0;i<3;i++){
  const cur=await obtenerIndice(),lista=fn(cur?cur.data:[]);
  try{await escribir('data/index.json',lista,cur&&cur.sha,msg);return lista}
  catch(e){if(e.status!==409&&e.status!==422)throw e}
 }
 throw new Error('No se pudo actualizar la lista. Inténtalo de nuevo.');
}
async function guardarNota(n){
 let sha=S.shas[n.id];
 if(sha===undefined){const c=await obtenerNota(n.id);sha=c?c.sha:null}
 try{S.shas[n.id]=await escribir(`data/notas/${n.id}.json`,n,sha,'Guardar: '+n.titulo)}
 catch(e){if(e.status===409||e.status===422)throw new Error('Este apunte cambió en otro dispositivo. Reabre el apunte para ver la versión nueva.');throw e}
 S.lista=await actualizarIndice(l=>[...l.filter(x=>x.id!==n.id),meta(n)],'Índice: '+n.titulo);
}
async function eliminarNota(id,sha){
 if(!sha){const c=await obtenerNota(id);sha=c&&c.sha}
 if(sha)await gh(`data/notas/${id}.json`,{method:'DELETE',body:JSON.stringify({message:'Eliminar apunte '+id,sha})});
 delete S.shas[id];
 S.lista=await actualizarIndice(l=>l.filter(x=>x.id!==id),'Índice: eliminar apunte');
}

/* ===== Interfaz ===== */
function toast(m,ms=4000){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)}
const setPane=p=>$('.app').dataset.pane=p;
const mats=()=>[...new Set(S.lista.map(n=>n.materia))].sort((a,b)=>a.localeCompare(b,'es'));
const tags=()=>[...new Set(S.lista.flatMap(n=>n.tags||[]))].sort((a,b)=>a.localeCompare(b,'es'));
function vis(){const q=S.q.trim().toLowerCase();
 return S.lista.filter(n=>(!S.mat||n.materia===S.mat)&&(!S.tag||(n.tags||[]).includes(S.tag))&&(!S.desde||n.fecha.slice(0,10)>=S.desde)&&(!q||n.titulo.toLowerCase().includes(q))).sort((a,b)=>b.fecha.localeCompare(a.fecha))}
function lst(){
 const ms=mats();
 $('#mats').innerHTML=`<li class="${S.mat?'':'on'}" data-m=""><span>Todas las materias</span><span class="mut">${S.lista.length}</span></li>`+ms.map(m=>`<li class="${S.mat===m?'on':''}" data-m="${esc(m)}"><span>${esc(m)}</span><span class="mut">${S.lista.filter(n=>n.materia===m).length}</span></li>`).join('');
 $('#tagsel').innerHTML='<option value="">Todas las etiquetas</option>'+tags().map(t=>`<option ${t===S.tag?'selected':''}>${esc(t)}</option>`).join('');
 $('#ln').textContent=S.mat||'Todos los apuntes';
 const v=vis();
 $('#items').innerHTML=v.map(n=>`<li class="${S.nota&&S.nota.id===n.id?'on':''}" data-id="${n.id}"><div class="t">${esc(n.titulo||'Sin título')}</div><div class="mut"><span class="badge">${esc(n.materia)}</span>${new Date(n.fecha).toLocaleDateString('es')}</div>${(n.tags||[]).length?`<div class="mut">${n.tags.map(t=>'#'+esc(t)).join(' ')}</div>`:''}</li>`).join('')||`<p class="mut">${S.lista.length?'Ningún apunte coincide con los filtros.':'Aún no hay apuntes. Crea el primero.'}</p>`;
}
function md(t){
 const M=[];t=t.replace(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$/g,m=>(M.push(m),`@@M${M.length-1}@@`));
 return DOMPurify.sanitize(marked.parse(t,{breaks:true})).replace(/@@M(\d+)@@/g,(_,i)=>esc(M[i]));
}
function ed(){
 const n=S.nota,m=$('#p3');
 if(!n){m.innerHTML='<div class="empty">Elige un apunte o crea uno nuevo.</div>';return}
 m.innerHTML=`<div class="hd"><button class="btn back" data-b="list" aria-label="Volver">‹</button><input class="ti" id="ti" placeholder="Título"><span class="mut" id="st"></span></div>
 <div class="meta"><input id="mt" list="dl" placeholder="Materia"><datalist id="dl">${mats().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><input id="tg" placeholder="Etiquetas separadas por coma"></div>
 <div class="tabs"><button class="btn on" data-t="w">Escribir</button><button class="btn" data-t="v">Vista previa</button><span class="sp"></span><button class="btn pri" id="sv">Guardar</button><button class="btn" id="dn">Eliminar</button></div>
 <textarea id="tx" placeholder="Escribe en Markdown. Fórmulas: $x^2$ o $$\\int_0^1 x\\,dx$$"></textarea><div class="md" id="pv" hidden></div>`;
 $('#ti').value=n.titulo;$('#mt').value=n.materia;$('#tg').value=(n.tags||[]).join(', ');$('#tx').value=n.texto;
 for(const id of ['ti','mt','tg','tx'])$('#'+id).oninput=()=>{S.dirty=true;$('#st').textContent='Sin guardar'};
 m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.t==='v';m.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
  $('#tx').hidden=v;$('#pv').hidden=!v;
  if(v){$('#pv').innerHTML=md($('#tx').value);renderMathInElement($('#pv'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
 });
 $('#sv').onclick=guardar;$('#dn').onclick=borrar;
}
const st=t=>{const e=$('#st');if(e)e.textContent=t};
function collect(){const n=S.nota;n.titulo=$('#ti').value.trim()||'Sin título';n.materia=$('#mt').value.trim()||'General';n.tags=$('#tg').value.split(',').map(s=>s.trim()).filter(Boolean);n.texto=$('#tx').value}
async function guardar(){
 const n=S.nota;if(!n)return;collect();n.fecha=new Date().toISOString();st('Guardando…');$('#sv').disabled=true;
 try{await guardarNota(n);S.dirty=false;st('Guardado')}catch(e){st('Error al guardar');toast(e.message)}
 $('#sv').disabled=false;lst();
}
async function abrir(id){
 if(S.dirty&&!confirm('Tienes cambios sin guardar. ¿Descartarlos?'))return;
 S.dirty=false;setPane('ed');$('#p3').innerHTML='<div class="empty">Cargando…</div>';
 try{const c=await obtenerNota(id);if(!c)throw new Error('No se encontró este apunte en el repositorio.');S.nota=c.data;S.shas[id]=c.sha}
 catch(e){S.nota=null;toast(e.message)}
 lst();ed();
}
async function borrar(){
 const n=S.nota;if(!n||!confirm(`¿Eliminar "${n.titulo||'Sin título'}"?`))return;
 try{if(S.shas[n.id]!==null)await eliminarNota(n.id,S.shas[n.id]);S.nota=null;S.dirty=false;setPane('list');lst();ed()}
 catch(e){toast(e.message)}
}
async function recargar(){try{const c=await obtenerIndice();S.lista=c?c.data:[];lst()}catch(e){toast(e.message)}}

$('#nn').onclick=()=>{
 if(S.dirty&&!confirm('Tienes cambios sin guardar. ¿Descartarlos?'))return;
 const t=new Date().toISOString(),id=uid();
 S.nota={id,titulo:'',materia:S.mat||'',tags:[],texto:'',creada:t,fecha:t};S.shas[id]=null;S.dirty=false;
 ed();setPane('ed');$('#ti').focus();
};
$('#mats').onclick=e=>{const li=e.target.closest('li');if(li){S.mat=li.dataset.m;lst();setPane('list')}};
$('#tagsel').onchange=e=>{S.tag=e.target.value;lst();setPane('list')};
$('#desde').onchange=e=>{S.desde=e.target.value;lst()};
$('#q').oninput=e=>{S.q=e.target.value;lst()};
$('#items').onclick=e=>{const li=e.target.closest('li');if(li)abrir(li.dataset.id)};
$('#ref').onclick=recargar;
$('#salir').onclick=()=>{if(confirm('Se borrará el token de este navegador. Tus apuntes siguen en GitHub.')){localStorage.removeItem('apuntes.cfg');location.reload()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b)setPane(b.dataset.b)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&S.nota){e.preventDefault();guardar()}});
addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CFG&&!S.dirty)recargar()});

/* ===== Configuración y arranque ===== */
async function boot(){
 $('#cfg').hidden=true;$('.app').hidden=false;lst();ed();
 try{const c=await obtenerIndice();if(!c)await escribir('data/index.json',[],null,'Crear índice inicial');S.lista=c?c.data:[];lst()}
 catch(e){toast(e.message,7000)}
}
$('#go').onclick=async()=>{
 const o=$('#ow').value.trim(),r=$('#rp').value.trim(),t=$('#tk').value.trim(),er=$('#cerr');er.textContent='';
 if(!o||!r||!t){er.textContent='Completa los tres campos.';return}
 CFG={owner:o,repo:r,token:t};$('#go').disabled=true;
 try{const c=await obtenerIndice();if(!c)await escribir('data/index.json',[],null,'Crear índice inicial');localStorage.setItem('apuntes.cfg',JSON.stringify(CFG));boot()}
 catch(e){CFG=null;er.textContent=e.message}
 $('#go').disabled=false;
};
if(CFG)boot();else $('#cfg').hidden=false;
</script>
</body></html>
